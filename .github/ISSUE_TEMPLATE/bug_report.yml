name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /admin/posts
        2. Click …
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Page or admin screen, browser, and local or deployed.
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Console or server output, if any.
      render: shell
