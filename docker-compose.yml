# Local Postgres for development: `docker compose up -d`, then use
# DATABASE_URL=postgres://stratafolio:stratafolio@127.0.0.1:5432/stratafolio
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stratafolio
      POSTGRES_PASSWORD: stratafolio
      POSTGRES_DB: stratafolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratafolio"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
